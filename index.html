<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Andes - Hệ thống lấy key</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Container chính -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-8 w-full max-w-md shadow-2xl">
        
        <!-- Tiêu đề -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">Key Andes</h1>
            <p class="text-gray-400 text-sm mt-1">Hoàn thành các mục bên dưới để nhận key (Hiệu lực: 24 giờ)</p>
        </div>

        <!-- Các mục vượt link -->
        <div class="space-y-4" id="steps-container">
            <!-- Mục 1 -->
            <div class="bg-gray-800/50 border border-gray-700/50 rounded-xl p-4 flex items-center justify-between" id="step-1">
                <div>
                    <h3 class="font-semibold text-sm">Mục 1</h3>
                    <p class="text-xs text-gray-400 status-text">Chưa hoàn thành</p>
                </div>
                <button onclick="startStep(1)" class="action-btn bg-purple-600 hover:bg-purple-700 text-xs px-4 py-2 rounded-lg font-medium transition cursor-pointer">Vượt mục</button>
            </div>

            <!-- Mục 2 -->
            <div class="bg-gray-800/50 border border-gray-700/50 rounded-xl p-4 flex items-center justify-between opacity-50 pointer-events-none" id="step-2">
                <div>
                    <h3 class="font-semibold text-sm">Mục 2</h3>
                    <p class="text-xs text-gray-400 status-text">Đang khóa</p>
                </div>
                <button onclick="startStep(2)" class="action-btn bg-purple-600 hover:bg-purple-700 text-xs px-4 py-2 rounded-lg font-medium transition cursor-pointer" disabled>Vượt mục</button>
            </div>

            <!-- Mục 3 -->
            <div class="bg-gray-800/50 border border-gray-700/50 rounded-xl p-4 flex items-center justify-between opacity-50 pointer-events-none" id="step-3">
                <div>
                    <h3 class="font-semibold text-sm">Mục 3</h3>
                    <p class="text-xs text-gray-400 status-text">Đang khóa</p>
                </div>
                <button onclick="startStep(3)" class="action-btn bg-purple-600 hover:bg-purple-700 text-xs px-4 py-2 rounded-lg font-medium transition cursor-pointer" disabled>Vượt mục</button>
            </div>
        </div>

        <!-- Nút Lấy Key ở dưới -->
        <div class="mt-6">
            <button id="final-btn" onclick="getKey()" class="w-full bg-gray-800 text-gray-500 font-bold py-3 rounded-xl cursor-not-allowed transition border border-gray-700" disabled>
                Lấy Key
            </button>
        </div>

        <!-- Bảng hiển thị Key (Ẩn ban đầu) -->
        <div id="result-box" class="hidden mt-6 bg-gray-800/80 border border-purple-500/50 rounded-xl p-4 text-center animate-pulse">
            <p class="text-xs text-purple-400 font-medium mb-2"><i class="fa-solid fa-key"></i> Key của bạn (Hạn dùng 24h):</p>
            <div class="flex items-center justify-between bg-gray-900 border border-gray-700 rounded-lg p-2">
                <span id="key-text" class="text-xs sm:text-sm font-mono text-green-400 truncate mr-2">ANDES-xxxx-xxxx-xxxx</span>
                <button onclick="copyKey()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs px-3 py-1.5 rounded-md transition flex items-center gap-1 shrink-0 cursor-pointer">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>
        </div>
    </div>

    <!-- Script xử lý logic -->
    <script>
        let completedSteps = 0;
        const totalSteps = 3;

        function startStep(stepNum) {
            const stepEl = document.getElementById(`step-${stepNum}`);
            const btn = stepEl.querySelector('.action-btn');
            const statusText = stepEl.querySelector('.status-text');

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            // Random thời gian từ 30 đến 56 giây
            let timeLeft = Math.floor(Math.random() * (56 - 30 + 1)) + 30;
            statusText.innerText = `Đang chờ: ${timeLeft}s`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    statusText.innerText = `Đang chờ: ${timeLeft}s`;
                } else {
                    clearInterval(timer);
                    statusText.innerText = 'Đã hoàn thành';
                    statusText.classList.remove('text-gray-400');
                    statusText.classList.add('text-green-400');
                    
                    btn.innerText = 'Hoàn thành';
                    btn.classList.remove('bg-purple-600', 'hover:bg-purple-700');
                    btn.classList.add('bg-green-600', 'text-white');
                    
                    completedSteps++;

                    // Mở khóa mục tiếp theo hoặc mở khóa nút lấy key nếu hết mục
                    if (stepNum < totalSteps) {
                        const nextStep = document.getElementById(`step-${stepNum + 1}`);
                        nextStep.classList.remove('opacity-50', 'pointer-events-none');
                        nextStep.querySelector('.action-btn').disabled = false;
                    } else {
                        if (completedSteps === totalSteps) {
                            const finalBtn = document.getElementById('final-btn');
                            finalBtn.disabled = false;
                            finalBtn.classList.remove('bg-gray-800', 'text-gray-500', 'cursor-not-allowed', 'border-gray-700');
                            finalBtn.classList.add('bg-gradient-to-r', 'from-purple-600', 'to-pink-600', 'hover:opacity-90', 'cursor-pointer', 'text-white', 'shadow-lg', 'shadow-purple-900/30');
                        }
                    }
                }
            }, 1000);
        }

        function getKey() {
            // Tạo chuỗi key ngẫu nhiên
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let randomPart = '';
            for (let i = 0; i < 12; i++) {
                randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const key = `ANDES-${randomPart.slice(0,4)}-${randomPart.slice(4,8)}-${randomPart.slice(8,12)}`;
            
            document.getElementById('key-text').innerText = key;
            
            const resultBox = document.getElementById('result-box');
            resultBox.classList.remove('hidden');
            resultBox.classList.remove('animate-pulse'); // Dừng hiệu ứng nhấp nháy sau khi hiện

            const finalBtn = document.getElementById('final-btn');
            finalBtn.disabled = true;
            finalBtn.innerText = 'Đã lấy Key thành công';
            finalBtn.className = 'w-full bg-gray-800 text-gray-500 font-bold py-3 rounded-xl cursor-not-allowed border border-gray-700';
        }

        function copyKey() {
            const keyText = document.getElementById('key-text').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert('Đã sao chép key thành công!');
            }).catch(err => {
                console.error('Không thể sao chép: ', err);
            });
        }
    </script>
</body>
</html>
